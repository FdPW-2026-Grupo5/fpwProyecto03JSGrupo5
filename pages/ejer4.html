<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/ejer4.css">
    <title>Ejercicio 4</title>
</head>

<body>
    <h1>Buscador de peliculas</h1>
    <div>
        <select id="filtroGenero">
            <option value="todos">Todos</option>
            <option value="Acción">Acción</option>
            <option value="Comedia">Comedia</option>
            <option value="Drama">Drama</option>
        </select>

        <button id="btnFiltrar">Filtrar por genero</button>
    </div>
    <div>
        <label for="filtroPuntaje">Puntaje:</label>
        <input type="number" id="filtroPuntaje" placeholder="Ingrese puntaje mínimo">

        <button id="btnFiltrarPuntaje">Filtrar por puntaje</button>
    </div>
    <ol id="listaPeliculas"></ol>

    <script type="module" src="../js/ejer4.js"></script>
</body>

</html>
